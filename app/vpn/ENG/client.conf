client
dev tun
proto tcp
remote vpn.meyerop.com 7101
resolv-retry infinite
nobind
persist-key
persist-tun
ca /userdata/app/vpn/ENG/ca.crt
cert /userdata/app/vpn/ENG/client.crt
key /userdata/app/vpn/ENG/client.key
tls-auth /userdata/app/vpn/ENG/ta.key 1
cipher AES-256-CBC
comp-lzo
verb 3
auth-user-pass /userdata/cnf/cnf.vpn-auth_eng
tls-cipher "DEFAULT:@SECLEVEL=0"
